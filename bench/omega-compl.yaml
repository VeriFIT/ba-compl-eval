spot:
  cmd: ../bin/spot-wrap.sh $1 --complement

spot-ba:
  cmd: ../bin/spot-wrap.sh $1 --complement --buchi

spot-red:
  cmd: ../bin/spot-wrap.sh $1 --complement --high

kofola:
  cmd: ../bin/kofola-wrap.sh $1 --complement

kofola-raw:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='raw=yes'

kofola-sim-prune:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='sim-ms-prune=yes'

kofola-sim-prune-check:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='sim-ms-prune=yes' --check

kofola-subs-tup:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='nac-alg=subs_tup'

kofola-subs-tup-check:
  cmd: ../bin/kofola-wrap.sh $1 --complement --check --params='nac-alg=subs_tup'

kofola-break:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='sh-break=yes'

kofola-check:
  cmd: ../bin/kofola-wrap.sh $1 --complement --check

kofola-red:
  cmd: ../bin/kofola-wrap.sh $1 --complement --high

kofola-tacas23:
  cmd: ../bin/kofola-tacas23-wrap.sh $1 --algo=comp --merge-iwa --merge-det --iw-sim

cola:
  cmd: ../bin/cola-wrap.sh $1 --determinize=ba --parity --acd --complement --simulation --use-scc

ranker:
  cmd: ../bin/ranker-wrap.sh $1 --best

kofola-tela-dnf:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='tela=yes'

kofola-tela-dnf-check:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='tela=yes' --check

kofola-tela-inductive:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='tela=yes;tela_det_alg=inductive'

kofola-tela-inductive-check:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='tela=yes;tela_det_alg=inductive' --check

kofola-tela-inductive-shb:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='tela=yes;tela_det_alg=inductive;sd_ind_sh_break=yes'

kofola-tela-inductive-shb-check:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='tela=yes;tela_det_alg=inductive;sd_ind_sh_break=yes' --check

kofola-tela-inductive-for:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='tela=yes;tela_det_alg=inductive;sd_ind_or_opt=yes'

kofola-tela-inductive-for-check:
  cmd: ../bin/kofola-wrap.sh $1 --complement --params='tela=yes;tela_det_alg=inductive;sd_ind_or_opt=yes' --check

owl:
  cmd: ../bin/owl-wrap.sh $1